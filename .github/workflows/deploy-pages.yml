name: Deploy Maverick Tutor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          set -eux
          rm -rf _site
          if [ -d dist ]; then cp -R dist _site; \
          elif [ -d .output/public ]; then cp -R .output/public _site; \
          elif [ -d .output/client ]; then cp -R .output/client _site; \
          else echo "No static output directory found"; find . -maxdepth 3 -type d | sort; exit 1; fi
          test -f _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
